<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Maha Khaliq</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:1.25rem;background:linear-gradient(145deg,#f4e5f7,#fbe7da);color:#432749;font:1rem/1.5 system-ui,sans-serif}
main{width:min(100%,26rem);padding:clamp(1.25rem,6vw,2.5rem);background:#fffbf7;border:1px solid #e4c8db;border-radius:24px;box-shadow:0 16px 50px #5c325521}
h1{font:500 clamp(2rem,8vw,3rem)/1.05 Georgia,serif;margin:0 0 .3rem}
p{margin:0 0 1.6rem;color:#66466a}
nav{display:grid;gap:.65rem}
a{display:flex;align-items:center;gap:.65rem;min-height:48px;padding:.75rem 1rem;border-radius:12px;background:#603867;color:#fff;text-decoration:none;font-weight:650}
a:hover{background:#492652}a:focus-visible{outline:3px solid #8c55a0;outline-offset:3px}
.mark{width:1.3rem;text-align:center}
.contact-form{display:grid;gap:.7rem;margin-top:1.2rem}
.contact-form h2{font:600 1.35rem/1.2 Georgia,serif;margin:0}
.contact-form label{display:grid;gap:.3rem;font-size:.94rem;font-weight:650}
.contact-form input,.contact-form textarea{width:100%;min-height:46px;border:1px solid #c7aac5;border-radius:10px;padding:.65rem .75rem;color:#38233f;background:#fff;font:inherit}
.contact-form textarea{min-height:116px;resize:vertical}
.contact-form :is(input,textarea):focus-visible{outline:3px solid #b277bd;outline-offset:2px}
.contact-form button{min-height:48px;border:0;border-radius:99px;background:#603867;color:#fff;font:650 1rem system-ui;cursor:pointer}
.contact-form [data-contact-status]{min-height:1.5em;margin:0;color:#66466a;font-size:.94rem}
.contact-form [data-state=success]{color:#176b42}.contact-form [data-state=error]{color:#a42f54}
.contact-honeypot{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
</style>
</head>
<body>
<main>
  <h1>Maha Khaliq</h1>
  <p>Game &amp; XR Developer</p>
  <nav aria-label="Contact links">
    <a href="https://www.linkedin.com/in/maha-khaliq-49a192202/" target="_blank" rel="noopener noreferrer"><span class="mark" aria-hidden="true">in</span> LinkedIn</a>
    <a href="mailto:mahakhaliq151@gmail.com"><span class="mark" aria-hidden="true">✉</span> Email Maha</a>
  </nav>
  <form class="contact-form" id="contact-form">
    <h2>Send a message</h2>
    <label>Name<input name="name" autocomplete="name" maxlength="80" required></label>
    <label>Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
    <label>Subject<input name="subject" maxlength="120" required></label>
    <label>Message<textarea name="message" maxlength="5000" required></textarea></label>
    <label class="contact-honeypot" aria-hidden="true">Leave this field empty<input name="website" tabindex="-1" autocomplete="off"></label>
    <button type="submit">Send message</button>
    <p data-contact-status role="status" aria-live="polite"></p>
  </form>
</main>
<script>
document.getElementById('contact-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const form = event.currentTarget;
  const status = form.querySelector('[data-contact-status]');
  const button = form.querySelector('button[type="submit"]');
  status.textContent = 'Sending your message…';
  status.dataset.state = 'pending';
  button.disabled = true;
  try {
    const response = await fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.fromEntries(new FormData(form).entries())),
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || 'Your message could not be sent. Please try again.');
    form.reset();
    status.textContent = 'Thanks! Your message was sent successfully.';
    status.dataset.state = 'success';
  } catch (error) {
    status.textContent = error.message || 'Your message could not be sent. Please try again.';
    status.dataset.state = 'error';
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
