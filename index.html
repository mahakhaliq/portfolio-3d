<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Coin Collector</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            cursor: grab;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        #hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 15px;
            text-align: center;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.7);
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            z-index: 10;
            pointer-events: none;
        }

        #message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            white-space: pre-line;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6);
            z-index: 10;
            pointer-events: none;
        }
    </style>

    <!-- three.js is served locally from ./lib/three (no internet needed) -->
    <script type="importmap">
        {
            "imports": {
                "three": "./lib/three/three.module.js"
            }
        }
    </script>
</head>

<body>
    <div id="score">Coins: 0</div>
    <div id="message"></div>
    <div id="hint">
        WASD / Arrows: move &nbsp;|&nbsp; Space: jump &nbsp;|&nbsp;
        Drag mouse or Q/E: rotate camera &nbsp;|&nbsp; Scroll: zoom &nbsp;|&nbsp; R: restart
    </div>

    <script type="module" src="index.js"></script>
</body>

</html>
