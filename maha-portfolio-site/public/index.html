<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maha · Portfolio</title>
<script type="importmap">{"imports":{"three":"./lib/three/three.module.js"}}</script>
<style>
:root{--ink:#3a2248;--plum:#4d2b57;--cream:#fff6ec;--rose:#e9a3ca;--gold:#e7b567}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;color:var(--ink);background:#d987b8;font:1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;position:fixed;inset:0;z-index:0}
header,aside,dialog,#near,#stick{position:fixed;z-index:1}
header{inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,4vw,48px);background:linear-gradient(#2b1838a8,transparent);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font:600 15px/1 system-ui;letter-spacing:.22em;text-transform:uppercase}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px 3px #e7b567aa}
button{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:12px 22px;background:var(--plum);color:#fff;transition:transform .15s,background .15s,box-shadow .15s}
button:hover{transform:translateY(-1px);background:#5f3770;box-shadow:0 8px 22px #4d2b5766}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
header button{background:#ffffff26;backdrop-filter:blur(10px);border:1px solid #ffffff55;padding:11px 20px;font-size:16px}
header button:hover{background:#ffffff3d}
aside,dialog{background:#fff6ecee;backdrop-filter:blur(14px);color:var(--ink);border:1px solid #ffffffcc;border-radius:26px;padding:clamp(22px,3vw,36px);box-shadow:0 20px 70px #3a1a4a66;width:min(420px,calc(100% - 32px))}
aside#welcome{bottom:22px;left:50%;transform:translateX(-50%);width:auto;max-width:calc(100% - 24px);padding:10px 12px;border-radius:99px}
aside#welcome p{margin:6px 0 0;font-size:1rem}
aside#welcome button{padding:15px 30px;font-size:clamp(16px,1.5vw,20px);font-weight:600}
#bubble{position:fixed;z-index:2;left:0;top:0;pointer-events:none;max-width:min(460px,86vw);background:#fff8f0;color:var(--plum);font:600 clamp(19px,1.9vw,27px)/1.35 system-ui,sans-serif;padding:16px 24px;border-radius:24px;box-shadow:0 10px 34px #3a1a4a55;border:1px solid #fff;transition:opacity .35s}
#bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:16px;height:16px;background:#fff8f0;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.eyebrow{font:650 .9375rem/1.35 system-ui;letter-spacing:.12em;text-transform:uppercase;color:#78435f;margin:0 0 14px}
h1,h2{font:500 clamp(32px,6vw,52px)/1.02 Georgia,serif;margin:0 0 14px;color:var(--plum)}
p{line-height:1.6;margin:0 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button.ghost{background:transparent;color:var(--plum);border:1.5px solid #4d2b5755;padding:10.5px 18px}
button.ghost:hover{background:#4d2b570f;box-shadow:none}
small{display:block;margin:18px 0 0;color:#6d4b7a;font-size:13px}
dialog::backdrop{background:#2a123a99;backdrop-filter:blur(4px)}
#near{bottom:26px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff6ece6;color:var(--plum);box-shadow:0 10px 36px #3a1a4a66;font-weight:600;padding:14px 26px}
#near:hover{transform:translateX(-50%) translateY(-2px);background:#fff}
#stick{display:none;left:18px;bottom:24px;width:104px;height:104px;border-radius:50%;border:2px solid #fff8;background:#35204788;touch-action:none}
#knob{position:absolute;left:29px;top:29px;width:42px;height:42px;background:#fff4e2;border-radius:50%;pointer-events:none}
#meter{display:inline-flex;align-items:flex-end;gap:2px;height:16px;margin-left:6px;vertical-align:middle}#meter i{width:3px;height:4px;background:var(--gold);border-radius:2px}
#hud{position:fixed;z-index:1;top:64px;right:clamp(16px,4vw,48px);display:none;gap:8px;color:#fff;font-size:15px;letter-spacing:.03em;text-shadow:0 1px 4px #0008}
body.playing #hud{display:flex}
#hud span{font-size:15px;background:#2b183866;backdrop-filter:blur(8px);border:1px solid #ffffff33;border-radius:99px;padding:6px 12px}
@media(any-pointer:coarse){body.playing #stick:not([hidden]){display:block}#near{left:auto;right:16px;transform:none}#hud{display:none!important}}
#portal{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(ellipse,#fff8e9,#f0b2e6 45%,#a675c7);transition:opacity .5s}
#portal.active{opacity:1}
#panel{width:min(31rem,calc(100% - 2rem));max-height:calc(100dvh - 2rem);overflow:auto;background:#fff6ec}
#stop-copy{font-size:clamp(1.125rem,1rem + .45vw,1.3125rem);line-height:1.55}
#near{font-size:1.0625rem;white-space:normal}
#near .stop-detail{display:block;font-size:1rem;font-weight:500;color:#65405f}
@media(any-pointer:coarse){#near{max-width:calc(100vw - 150px);padding:9px 15px}}
canvas{touch-action:none}#jump{display:none}.robot-board{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0}.robot-board span{background:#ebdce8;border-radius:8px;text-align:center;padding:5px;font-size:22px}.game-controls{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 15px}.game-controls button{padding:8px 13px;min-height:44px}
@media(any-pointer:coarse){body.playing #jump{display:block;position:fixed;z-index:1;right:18px;bottom:24px}#near{bottom:85px}}
body.in-game #jump,body.in-game #hud,body.in-game #bubble{display:none!important}.chat-log{max-height:34vh;overflow:auto}.chat-log a{display:block;margin-bottom:8px}.chat-form{display:flex;gap:8px;margin:12px 0}.chat-form input{min-width:0;flex:1;padding:10px;font:inherit}
 .contact-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.65rem;margin-bottom:1rem}
.contact-links a{display:flex;align-items:center;gap:.6rem;min-height:48px;padding:.65rem .8rem;border:1px solid #ccb1cb;border-radius:12px;background:#fff;color:#46234e;font-weight:650}
.contact-links a:hover{background:#f6e8f1}
.contact-links a:focus-visible{outline:3px solid #804b90;outline-offset:2px}
.contact-links :is(img,svg){flex:none}
.contact-links img{width:32px;height:32px;padding:4px;background:#0a66c2;border-radius:5px}
body.greeting #bubble{top:auto;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;text-align:center}
body.greeting #bubble::after{display:none}
/* About flash cards */
.about-deck{margin-bottom:1rem;touch-action:pan-y}
.about-stack{position:relative;isolation:isolate;margin:.95rem .25rem .8rem .65rem;perspective:850px}
.about-stack::before,.about-stack::after{content:"";position:absolute;inset:0 0 .2rem;border:1px solid #bc91b9;border-radius:10px;transform-origin:1.35rem 1.35rem;pointer-events:none}
.about-stack::before{z-index:-2;transform:rotate(4deg);background:repeating-linear-gradient(135deg,#f6dace 0 4px,#f8eef9 4px 8px,#d7bee7 8px 12px,#f8eef9 12px 16px);box-shadow:0 7px 16px #63365b26}
.about-stack::after{z-index:-1;transform:rotate(2deg);background:#e7cbea}
.about-ring{position:absolute;z-index:2;pointer-events:none;top:-.7rem;left:.96rem;width:.83rem;height:2.1rem;border:4px solid #9a669a;border-left-color:#c89ac5;border-radius:50%;transform:rotate(-24deg);box-shadow:2px 2px 2px #43204544,inset 1px 0 0 #63345e}
.about-flash{position:relative;isolation:isolate;overflow:hidden;min-height:14rem;padding:1.8rem 1.25rem 1.25rem;border:1px solid #cfa8cc;border-radius:10px;background:linear-gradient(135deg,#fffaf2,#f9edf9);box-shadow:0 3px 8px #63365b20;transform-origin:1.35rem 1.35rem}
.about-flash::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(125deg,#d29cb6 0 4px,#fff5e9 4px 8px,#b8a1d2 8px 12px,#fff5e9 12px 16px)}
.about-flash::after{content:"";position:absolute;top:.92rem;left:1.17rem;width:.55rem;height:.55rem;border-radius:50%;background:#9e729e;box-shadow:inset 1px 1px 2px #50294b70}
.about-flash:not([hidden]){animation:flash-in .28s ease-out}
@keyframes flash-in{from{opacity:.35;transform:rotate(-3deg) rotateY(-25deg)}to{opacity:1;transform:rotate(0) rotateY(0)}}
@media(prefers-reduced-motion:reduce){.about-flash:not([hidden]){animation:none}}
.about-flash h3{font:600 clamp(1.48rem,4vw,2.15rem)/1.12 Georgia,serif;color:#542e61;margin:0 0 .7rem}
.about-flash p{margin:0 0 .45rem}
.about-flash.education{padding-bottom:5rem}
.ned-photo{position:absolute;z-index:-1;bottom:0;right:0;width:85%;height:66%;object-fit:cover;object-position:center 37%;opacity:.45;mask-image:linear-gradient(145deg,transparent 37%,#000 83%)}
.work-list,.tech-logos{margin:0;padding:0;list-style:none}
.work-list li+li{margin-top:.55rem;padding-top:.5rem;border-top:1px solid #ddc4df}
.work-list span{display:block;font-size:.9rem}
.tech-logos{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.4rem,1fr));gap:.35rem}
.tech-logos li{display:flex;align-items:center;gap:.4rem;padding:.3rem;border-radius:6px;background:#fffcfa;font-size:.8rem;line-height:1.1}
.tech-logos img{flex:none}
.about-flash .tech-extra{font-size:.88rem;margin-top:.65rem}
.deck-nav{display:flex;gap:.5rem;align-items:center;justify-content:space-between;margin-top:.75rem}
.deck-nav button{min-height:44px;padding:.45rem .95rem}
.deck-nav button:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
#garden-loading{position:fixed;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:.85rem;padding:1.25rem;text-align:center;background:#050305;color:#fff5ec}
#garden-loading[hidden],#garden-loading [hidden]{display:none}
.loader-mascot{width:clamp(112px,24vmin,190px);aspect-ratio:1;border-radius:50%;background:#050305 url('./welcome-mascot.png') 50% 77.5% / 398% auto no-repeat;box-shadow:0 0 45px #d77bd044}
@keyframes mascot-sway{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-7px) rotate(4deg)}
}
.loader-mascot{transform-origin:50% 68%;animation:mascot-sway 3.2s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.loader-mascot{animation:none}}
#garden-loading h1{max-width:24ch;margin:0;color:inherit;font-size:clamp(1.65rem,5vw,3rem)}
#garden-load-status{margin:0;color:#f5c4ed}
.loader-track{width:min(70vw,19rem);height:14px;overflow:hidden;border:2px solid #efaddf;border-radius:99px;background:#281322}
.loader-track::before{content:"";display:block;width:43%;height:100%;border-radius:inherit;background:repeating-linear-gradient(130deg,#b959a6 0 12px,#df86cc 12px 24px);animation:loader-sweep 1.15s ease-in-out infinite alternate}
@keyframes loader-sweep{to{transform:translateX(132%)}}
@media(prefers-reduced-motion:reduce){.loader-track::before{animation:none;width:100%}}
#garden-loading button{min-height:44px}
.theme-picker{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;border:0;padding:0;margin:0}
.theme-picker legend{margin:0 auto .35rem;font-size:.9rem;color:#f5c4ed}
.theme-picker input{position:absolute;width:1px;height:1px;opacity:0}
.theme-picker label{display:flex;align-items:center;justify-content:center;gap:.45rem;min-width:6.4rem;min-height:44px;padding:.45rem .7rem;border:1px solid #a685a0;border-radius:999px;color:#fff5ec;cursor:pointer}
.theme-picker input:checked+label{background:#f2cfe8;color:#342036;border-color:#f2cfe8;font-weight:700}
.theme-picker input:focus-visible+label{outline:3px solid #fff;outline-offset:3px}
.theme-swatch{width:.8rem;height:.8rem;border-radius:50%;background:#ffc891;border:1px solid #906075}
#theme-night+label .theme-swatch{background:#634ba0}
#garden-loading{overflow:auto;place-content:safe center}
@media(max-height:450px){#garden-loading{gap:.45rem;padding:.65rem}.loader-mascot{width:76px}}
.achievement-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8.3rem),1fr));gap:.85rem;padding:1rem;margin:0 0 1rem;border:2px solid #bd8aab;border-radius:14px;background:#e6c0d3}
.achievement-grid[hidden],.achievement-viewer[hidden]{display:none}
.achievement-grid button{position:relative;display:grid;justify-items:center;align-content:start;gap:.4rem;border-radius:5px;padding:.55rem;background:#fff8eb;color:#512f50;box-shadow:0 3px 8px #61345633;text-align:center;font-size:.82rem;font-weight:650;transform:rotate(-1deg)}
.achievement-grid button:nth-child(even){transform:rotate(1deg)}
.achievement-grid button::before{content:"";position:absolute;top:-4px;left:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#efd2a0,#a06047);box-shadow:0 1px 3px #53304066}
.achievement-grid button:hover,.achievement-grid button:focus-visible{transform:translateY(-2px);z-index:1;background:#fffdf6}
.achievement-grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain}
.achievement-viewer{margin:0 0 1rem;display:grid;gap:.7rem;justify-items:start}
.achievement-viewer img{display:block;width:100%;max-height:54dvh;object-fit:contain;background:#fff7ed}
#cinema-controls{position:fixed;bottom:max(1rem,env(safe-area-inset-bottom));left:50%;z-index:3;transform:translateX(-50%);display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:.4rem;width:max-content;max-width:95vw;background:#fff5ec;padding:.55rem;border-radius:14px;box-shadow:0 4px 16px #54315455}
#cinema-controls[hidden],#promo-status:empty{display:none}
#promo-status{font-size:.83rem;margin:0;width:100%;text-align:center}
body.watching-cinema #jump,body.watching-cinema #hud,body.watching-cinema #flower-count,body.watching-cinema #bubble{display:none!important}
#flower-count{position:fixed;top:4.5rem;left:.8rem;z-index:1;padding:.35rem .65rem;border-radius:999px;background:#553662e8;color:#fff4e9;font-size:.83rem;pointer-events:none}
.flower-blueprint{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(9,1fr);width:min(100%,18rem);margin:.55rem auto;aspect-ratio:7/9;gap:3px;background:#eedbea;border:1px solid #d3b4d6;border-radius:.55rem;padding:.4rem}
.flower-blueprint button{min-width:0;width:100%;padding:0;border:2px dashed var(--block);border-radius:.2rem;background:#fff7f3;box-shadow:none}
.flower-blueprint button[aria-pressed=true]{border-style:solid;border-color:#fff7;border-bottom-color:#0003;background:var(--block)}
.flower-status{margin:.45rem 0 .8rem;font-size:.92rem}
#panel.project-gallery{width:min(43rem,calc(100% - 1.25rem));padding:clamp(.8rem,3vw,1.65rem)}
.project-card{padding:1.65rem .8rem .8rem}
.project-card h3{font-size:clamp(1.2rem,4vw,1.65rem);margin-bottom:.35rem}
.project-card p{font-size:.94rem;margin-bottom:.65rem}
.project-card video{display:block;width:100%;aspect-ratio:16/9;max-height:49dvh;object-fit:contain;border-radius:8px;background:#140f1b}
</style>

<section id="garden-loading" aria-labelledby="garden-loading-title">
  <div class="loader-mascot" aria-hidden="true"></div>
  <h1 id="garden-loading-title">Are you ready to dive into Maha’s portfolio?</h1>
  <div class="loader-track" aria-hidden="true"></div>
  <p id="garden-load-status" role="status">Loading the 3D garden…</p>
  <fieldset class="theme-picker" id="garden-theme">
    <legend>Choose a garden theme</legend>
    <input type="radio" name="garden-theme" id="theme-day" value="day" checked>
    <label for="theme-day"><span class="theme-swatch" aria-hidden="true"></span>Day</label>
    <input type="radio" name="garden-theme" id="theme-night" value="night">
    <label for="theme-night"><span class="theme-swatch" aria-hidden="true"></span>Night</label>
  </fieldset>
  <button id="start" type="button" hidden disabled>Start tour</button>
  <button id="garden-retry" type="button" hidden>Reload page</button>
</section>
<div id="flower-count" hidden aria-live="polite"></div>
<div id="cinema-controls" hidden aria-label="Film controls">
  <button id="promo-play" type="button">Play</button>
  <button id="promo-leave" type="button" class="ghost">Back to garden</button>
  <p id="promo-status" role="status"></p>
</div>
<div id="portal"></div>
<header><div class="brand"><i></i>Maha · Portfolio</div></header>
<div id="hud"><span>WASD / arrows · move</span><span>Space · jump</span><span>E · open</span></div>
<aside id="welcome" hidden>
  <p id="error" role="alert" hidden></p>
</aside>
<div id="bubble" hidden><span id="bubble-text"></span></div>
<div id="stick" aria-label="Movement joystick" hidden><div id="knob"></div></div>
<button id="jump" aria-label="Jump">Jump ↑</button><button id="near" hidden></button>
<dialog id="panel" aria-labelledby="stop-title"><p class="eyebrow">Garden stop</p><h2 id="stop-title"></h2><p id="stop-copy"></p><div id="game"></div><form method="dialog"><button>Back to garden</button></form></dialog>

<script type="module">
  const loading = document.getElementById('garden-loading');
  const status = document.getElementById('garden-load-status');
  const track = loading.querySelector('.loader-track');
  const start = document.getElementById('start');
  const retry = document.getElementById('garden-retry');
  const slow = setTimeout(() => {
    status.textContent = 'Still preparing the 3D garden…';
  }, 12000);
  document.addEventListener('garden-ready', () => {
    clearTimeout(slow);
    track.hidden = true;
    status.textContent = 'The garden is ready.';
    start.disabled = false;
    start.hidden = false;
  }, {once:true});
  document.addEventListener('garden-load-error', showLoadError, {once:true});
  function showLoadError() {
    clearTimeout(slow);
    track.hidden = true;
    status.textContent = document.getElementById('error').textContent || 'The 3D garden could not load. Please reload to try again.';
    retry.hidden = false;
  }
  retry.onclick = () => location.reload();
  import('./cloud-garden.js').catch(showLoadError);
</script>
